<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Me, Jonathan</title><style>body{font-family:sans-serif;background:#1a1a1a;color:#fff;text-align:center;padding:20px}.box{max-width:500px;margin:auto;background:#2d2d2d;padding:20px;border-radius:10px;position:relative}.tv{background:#000;border:10px solid #4b6584;height:120px;margin:20px 0;display:flex;flex-direction:column;justify-content:center;font-weight:bold}#show{font-size:1.5em;color:#ff9f43}#tier{font-size:0.9em;letter-spacing:1px;margin-top:5px}.bar{background:#4b6584;height:20px;border-radius:10px;overflow:hidden;margin:10px 0}#fill{background:#10ac84;height:100%;width:100%;transition:0.3s}button{background:#ff6b6b;color:#fff;border:none;padding:12px;font-size:1.1em;font-weight:bold;border-radius:5px;cursor:pointer;width:100%;margin-bottom:10px}button:hover{background:#ff4757}input{width:95%;padding:10px;font-size:1em;border-radius:5px;border:none;margin-bottom:10px;text-align:center}#go{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);display:none;flex-direction:column;justify-content:center;align-items:center;border-radius:10px;z-index:10}#go h2{color:#ee5253;margin:0 0 15px 0}#go button{background:#10ac84;width:50%}.sw-btn{background:#2e86de;padding:8px 15px;font-size:0.9em;margin-bottom:20px;display:inline-block;width:auto;text-decoration:none;border-radius:5px;color:#fff;font-weight:bold}</style></head><body><a href="index.html" class="sw-btn">🔄 Switch to Game 2.0 (200 Shows)</a><div class="box"><div id="go"><h2>❌ GAME OVER ❌</h2><p style="margin-bottom:20px">Jonathan's mood hit 0%!</p><button onclick="rst()">Try Again</button></div><h1>Me, Jonathan</h1><div class="tv"><div id="show">TV OFF</div><div id="tier">PRESS BUTTON OR TYPE SHOW</div></div><div>Mood: <span id="txt">100%</span></div><div class="bar"><div id="fill"></div></div><button onclick="playRand()">🔴 RANDOM SHOW BUTTON</button><input type="text" id="inp" placeholder="Type show name & press Enter..." onkeydown="handleKey(event)"><p id="react" style="font-style:italic;margin-top:15px">Turn on the TV!</p></div><script>const db={best:["Wow! Wow! Wubbzy!"],adore:["Oswald","Ni Hao, Kai Lan","The Backyardigans","Blue's Clues"],love:["Yo Gabba Gabba!","LazyTown","Wonder Pets","Go Diego Go!","Maggie and the Ferocious Beast"],like:["Team Umizoomi","Gullah Gullah Island","The Upside Down Show","Little Bear","Franklin","Max and Ruby","Peter Rabbit","Wallykazam!","Rusty Rivets","Bob the Builder","Curious Buddies","Jack's Big Music Show!","The Fresh Beat Band"],neutral:["Dora The Explorer","Zack and Quack","Lalaloopsy","Maisy","Bubble Guppies","Julius Jr.","Top Wing","Nella the Princess Knight","Hey Duggee","Blaze and the Monster Machines","Pocoyo","Mutt and Stuff","Corn and Peg"],dislike:["Abby Hatcher","Blue's Room","Ryan's Mystery Playdate","Rainbow Rangers","Franklin and Friends","Butterbean's Cafe","DORA and Friends into the city","Ben and Holly's Little Kingdom","Tickety Toc","Olivia","Blue's Clues and You!"],hate:["Sunny Day","Baby Shark's Big Show!","Ricky Zoom","Peppa Pig","Little Bill","Little Charmers","Shimmer and Shine","Mike the Knight","PAW Patrol","Tim Rex in Space","Mr. Crocodile"],worst:["Rubble and Crew"]};let mood=100,curAudio=null;const all=[];Object.keys(db).forEach(k=>db[k].forEach(s=>all.push({name:s,tier:k})));function playRand(){const r=all[Math.floor(Math.random()*all.length)];react(r.name,r.tier)}function handleKey(e){if(e.key==="Enter"){const val=document.getElementById("inp").value.trim().toLowerCase();if(!val)return;const r=all.find(x=>x.name.toLowerCase()===val);if(curAudio){curAudio.pause();curAudio.currentTime=0}if(r){react(r.name,r.tier)}else{document.getElementById("show").innerText="Unknown Show";document.getElementById("tier").innerText="❓ NOT IN LIST";document.getElementById("react").innerText="Jonathan scratches his head. 'Never heard of it!'";curAudio=new Audio("huhhhh_PCYb2YE.mp3");curAudio.play().catch(ex=>console.log(ex))}document.getElementById("inp").value=""}}function rst(){mood=100;document.getElementById("go").style.display="none";document.getElementById("show").innerText="TV OFF";document.getElementById("tier").innerText="PRESS BUTTON OR TYPE SHOW";document.getElementById("react").innerText="Turn on the TV!";document.getElementById("txt").innerText="100%";document.getElementById("fill").style.width="100%";document.getElementById("fill").style.backgroundColor="#10ac84";if(curAudio){curAudio.pause();curAudio.currentTime=0}}function react(name,k){if(curAudio){curAudio.pause();curAudio.currentTime=0}document.getElementById("show").innerText=name;let t="",r="",c="#10ac84",d=[],aud="";if(k==="best"){mood=100;t="🏆 BEST SHOW!";d=['Jonathan dances and yells: "Wubbzy, Wubbzy, Wow, Wow!"','Jonathan cheers: "The undisputed champion of television!"','Jonathan jumps in the air: "Pure perfection!"'];c="#ff9f43";aud="m_1.mp3"}else if(k==="adore"){mood=Math.min(mood+15,100);t="🥈 ADORE IT";d=['Jonathan relaxes happily. "An absolute masterpiece."','Jonathan smiles warmly. "This show brings back pure joy."','Jonathan sighs with relief. "This is phenomenal television right here."'];aud="yes-yes-yes-yes-yes.mp3"}else if(k==="love"){mood=Math.min(mood+10,100);t="❤️ LOVE IT";d=["Jonathan smiles and claps along to the theme song!","Jonathan bops his head. \"Man, I really love this show!\"","Jonathan grabs snacks. \"Time for an amazing episode!\""];aud="omgwow.mp3"}else if(k==="like"){mood=Math.min(mood+5,100);t="👍 LIKE";d=['Jonathan nods along. "Yeah, this is pretty good."','Jonathan relaxes on the couch. "Decent show, I can always watch this."','Jonathan smiles slightly. "Not a masterpiece, but definitely solid."'];aud="talking-benn-yes.mp3"}else if(k==="neutral"){t="😐 NEUTRAL";d=["Jonathan stares blankly at the screen in complete silence.","Jonathan yawns. \"Yeah, this one is just okay.\"","Jonathan shrugs his shoulders. \"Neither good nor bad.\""];aud="meh_fhSwpDp.mp3"}else if(k==="dislike"){mood=Math.max(mood-15,0);t="👎 DISLIKE";d=['Jonathan crosses his arms. "Eh, I\'m really not a fan of this."','Jonathan rolls his eyes. "Can we change the channel soon?"','Jonathan frowns. "This episode is pretty boring."'];c="#cf6a17";aud="nah-b.mp3"}else if(k==="hate"){mood=Math.max(mood-25,0);t="🤮 HATE IT";d=['Jonathan groans. "Ugh! Get this trash off my screen!"','Jonathan covers his ears. "This show drives me absolutely crazy!"','Jonathan covers his eyes. "Why is this garbage still airing?!"'];c="#ee5253";aud="nope_DUF1LFX.mp3"}else if(k==="worst"){mood=0;t="❌ THE WORST";d=["Jonathan screams and throws his shoe straight at the TV!","Jonathan panics. \"IT'S THE FINAL BOSS OF TRASH!! TURN IT OFF!\"","Jonathan facepalms in pure rage. \"HOW IS THIS SHOW EVEN REAL?!\""];c="#000000";aud="toms-screams.mp3"}document.getElementById("tier").innerText=t;document.getElementById("react").innerText=d[Math.floor(Math.random()*d.length)];document.getElementById("txt").innerText=mood+"%";document.getElementById("fill").style.width=mood+"%";document.getElementById("fill").style.backgroundColor=c;if(aud){curAudio=new Audio(aud);curAudio.play().catch(e=>console.log(e))}if(mood<=0){setTimeout(()=>{document.getElementById("go").style.display="flex"},500)}}</script></body></html>
