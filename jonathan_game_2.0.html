<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Jonathan 2.0</title><style>body{font-family:sans-serif;background:#141414;color:#fff;text-align:center;padding:10px;margin:0;min-height:100vh;position:relative}.box{max-width:480px;margin:15px auto;background:#242424;padding:20px;border-radius:15px;position:relative;border:1px solid #3a3a3a}.tv{background:#000;border:12px solid #3c4043;height:110px;margin:12px 0;display:flex;flex-direction:column;justify-content:center;font-weight:bold;border-radius:10px}#show{font-size:1.35em;color:#ff9f43;padding:0 10px}#tier{font-size:0.85em;margin-top:4px}.bar{background:#3a3a3a;height:16px;border-radius:8px;overflow:hidden;margin:8px 0}#fill{background:#10ac84;height:100%;width:100%;transition:width 0.2s}#top-bar{display:flex;justify-content:space-between;font-size:0.85em;margin-bottom:10px;background:#1a1a1a;padding:8px;border-radius:8px}button{background:#ff6b6b;color:#fff;border:none;padding:12px;font-size:1.1em;font-weight:bold;border-radius:8px;cursor:pointer;width:100%;margin-bottom:8px}input{width:92%;padding:10px;font-size:1em;border-radius:8px;border:2px solid #444;text-align:center;background:#111;color:#fff;outline:none}.sw-btn{background:#2e86de;padding:6px 12px;font-size:0.85em;margin-bottom:10px;display:inline-block;text-decoration:none;border-radius:5px;color:#fff;font-weight:bold}.history-box{background:#1a1a1a;border-radius:8px;padding:8px;margin-top:15px;text-align:left;font-size:0.8em;max-height:80px;overflow-y:auto;border:1px solid #333}.history-title{font-weight:bold;color:#a4b0be;margin-bottom:4px;border-bottom:1px solid #333}#ach-menu{position:absolute;top:0;left:0;width:100%;height:100%;background:rgba(20,20,20,0.98);display:none;flex-direction:column;border-radius:15px;z-index:20;box-sizing:border-box;padding:20px}.ach-item{background:#2d2d2d;border:1px solid #444;border-radius:6px;padding:8px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.ach-name{font-weight:bold
